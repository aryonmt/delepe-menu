services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: delepe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-delepe}
      POSTGRES_DB: delepe
    ports:
      - "127.0.0.1:${POSTGRES_PUBLISH_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delepe -d delepe"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db-test:
    profiles: ["test"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: delepe
      POSTGRES_PASSWORD: delepe
      POSTGRES_DB: delepe_test
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delepe -d delepe_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: always
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://delepe:${POSTGRES_PASSWORD:-delepe}@db:5432/delepe
      STORAGE_ROOT: /data/storage
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      HOME: /home/nextjs
      COREPACK_HOME: /home/nextjs/.cache/node/corepack
    volumes:
      - storage:/data/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      CADDY_SITE: ${CADDY_SITE:-http://:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
    name: delepe_pgdata
  storage:
    name: delepe_storage
  caddy_data:
    name: delepe_caddy_data
  caddy_config:
    name: delepe_caddy_config
