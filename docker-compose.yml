services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: delepe
      POSTGRES_PASSWORD: delepe
      POSTGRES_DB: delepe
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delepe -d delepe"]
      interval: 5s
      timeout: 5s
      retries: 10

  db-test:
    profiles: ["test"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: delepe
      POSTGRES_PASSWORD: delepe
      POSTGRES_DB: delepe_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delepe -d delepe_test"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
