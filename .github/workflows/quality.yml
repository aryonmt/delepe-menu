name: quality

on:
  push:
    branches: [main, m8]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: delepe
          POSTGRES_PASSWORD: delepe
          POSTGRES_DB: delepe_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U delepe -d delepe_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      DATABASE_URL: postgresql://delepe:delepe@localhost:5433/delepe_test
      E2E_DATABASE_URL: postgresql://delepe:delepe@localhost:5433/delepe_test
      SESSION_SECRET: ci-session-secret-must-be-32-bytes-xx
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: change-me-now
      STORAGE_ROOT: ./storage
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm exec prisma generate
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Migrate CI database
        run: pnpm db:deploy
      - name: Build + bundle analysis
        env:
          ANALYZE: "true"
        run: pnpm build
      - name: Public bundle check
        run: pnpm check:bundle
      - name: Audit (advisory)
        continue-on-error: true
        run: pnpm audit --audit-level=high
      - name: Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E
        run: pnpm test:e2e
      - name: Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
